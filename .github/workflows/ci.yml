name: CI Portal Fogão

# CI only — no github-pages environment (avoids action_required em PRs).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tools/requirements.txt
            pyproject.toml

      - name: Create venv & install Python deps
        run: |
          python -m venv .venv
          .venv/bin/python -c "import sys; assert sys.version_info >= (3, 12), sys.version"
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -r tools/requirements.txt
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python --version

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install & build Angular
        working-directory: apps/web
        run: |
          npm ci
          npm run build -- --base-href=/${{ github.event.repository.name }}/
          cp dist/web/browser/index.html dist/web/browser/404.html
