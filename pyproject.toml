[project]
name = "botafogo-portal-tools"
version = "0.1.0"
description = "Content pipeline and tooling for Portal Fogão"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0",
  "python-frontmatter>=1.1.0",
  "feedparser>=6.0.0",
  "httpx>=0.27.0",
  "PyYAML>=6.0",
  "curl_cffi>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.9.0",
  "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tools*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tools"]
pythonpath = ["tools"]
