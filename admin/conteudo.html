<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Editor de conteúdo — Portal Fogão</title>
    <link rel="stylesheet" href="./admin.css" />
    <link href="./config.yml" type="text/yaml" rel="cms-config-url" />
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f7f7f7;
      }

      #crm-chrome {
        position: sticky;
        top: 0;
        z-index: 100000;
      }

      .crm-cms-banner {
        padding: 0.65rem 1.5rem;
        background: #fff;
        border-bottom: 1px solid rgba(10, 10, 10, 0.12);
        font-size: 0.9rem;
        color: rgba(10, 10, 10, 0.64);
      }

      .crm-cms-banner a {
        font-weight: 700;
        color: #0a0a0a;
      }

      #cms-status {
        margin: 0;
        padding: 1.25rem 1.5rem;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: rgba(10, 10, 10, 0.7);
        background: #f0f0f0;
        border-bottom: 1px solid rgba(10, 10, 10, 0.08);
      }

      #cms-status[data-state="err"] {
        color: #9b1c1c;
        background: rgba(155, 28, 28, 0.08);
      }

      #cms-status[hidden] {
        display: none;
      }

      #nc-root {
        min-height: calc(100vh - 7.5rem);
      }
    </style>
  </head>
  <body>
    <div id="crm-chrome">
      <header class="crm-top">
        <a class="crm-brand" href="./index.html">
          <span class="crm-brand__mark" aria-hidden="true"></span>
          <span class="crm-brand__text">
            <strong>Portal Fogão</strong>
            <small>Editor de conteúdo</small>
          </span>
        </a>
        <nav class="crm-nav" aria-label="Principal">
          <a href="./index.html">Início</a>
          <a href="./conteudo.html" aria-current="page">Conteúdo</a>
          <a href="./tabelas.html">Tabelas</a>
          <a href="/" target="_blank" rel="noopener">Ver site</a>
        </nav>
      </header>
      <div class="crm-cms-banner">
        Para atualizar a classificação do Brasileirão pela fonte de dados, use
        <a href="./tabelas.html">Atualizar tabelas</a>
        — não a coleção Site.
      </div>
    </div>

    <p id="cms-status" role="status">Carregando editor Decap…</p>

    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.1.2/dist/decap-cms.js"></script>
    <script>
      (function () {
        const status = document.getElementById("cms-status");
        const chrome = document.getElementById("crm-chrome");
        const isLocal =
          location.hostname === "localhost" || location.hostname === "127.0.0.1";

        function showError(msg) {
          status.hidden = false;
          status.dataset.state = "err";
          status.innerHTML = msg;
        }

        function keepChromeOnTop() {
          if (chrome && document.body.firstElementChild !== chrome) {
            document.body.prepend(chrome);
          }
        }

        async function boot() {
          try {
            const configUrl = new URL("./config.yml", window.location.href).href;
            const res = await fetch(configUrl, { cache: "no-store" });
            if (!res.ok) {
              throw new Error(
                "Não achei <code>config.yml</code> em " +
                  configUrl +
                  " (HTTP " +
                  res.status +
                  "). Rode <code>npm run prepare:content</code> ou <code>npm run dev</code>.",
              );
            }

            let link = document.querySelector('link[rel="cms-config-url"]');
            if (!link) {
              link = document.createElement("link");
              link.rel = "cms-config-url";
              link.type = "text/yaml";
              document.head.appendChild(link);
            }
            link.href = configUrl;

            if (typeof CMS === "undefined") {
              throw new Error(
                "Falha ao carregar o script do Decap (unpkg). Verifique a rede/adblock.",
              );
            }

            // Decap só aceita: prePublish, postPublish, preUnpublish,
            // postUnpublish, preSave, postSave — não use preMount.
            const observer = new MutationObserver(keepChromeOnTop);
            observer.observe(document.body, { childList: true });

            CMS.init();
            keepChromeOnTop();

            if (isLocal) {
              status.textContent =
                "Editor local — use npm run dev (proxy Decap na porta 8081).";
              setTimeout(function () {
                status.hidden = true;
              }, 4000);
            } else {
              status.innerHTML =
                "Ambiente publicado: o Decap pede login GitHub (OAuth). " +
                "Para editar sem OAuth, use <code>npm run dev</code> em " +
                "<code>http://localhost:4200/admin/</code>.";
            }
          } catch (err) {
            showError(
              (err && err.message) ||
                "Erro ao iniciar o editor. Abra o console (F12) para detalhes.",
            );
            console.error(err);
          }
        }

        boot();
      })();
    </script>
  </body>
</html>
