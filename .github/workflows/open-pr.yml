name: Abrir PR para main

# Em todo push fora de main, garante um PR aberto para main.
# Requer: Settings → Actions → General → Workflow permissions
#   - Read and write permissions
#   - Allow GitHub Actions to create and approve pull requests
on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: open-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  open-pr:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Criar ou reutilizar PR para main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME}"

          EXISTING="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING" ]]; then
            echo "PR #$EXISTING já aberto para $BRANCH → main"
            exit 0
          fi

          TITLE="$(git log -1 --pretty=%s)"
          BODY="$(cat <<'EOF'
          ## Resumo

          PR aberto automaticamente a partir da branch `__BRANCH__`.

          Último commit: `__SHA__` — __TITLE__

          ## Checklist

          - [ ] Diff revisado
          - [ ] CI (validate-and-build) verde
          - [ ] Merge em `main` (dispara o deploy no Pages)
          - [ ] Em repo solo: nao use Approve no proprio PR — o GitHub bloqueia; use Merge

          ## Site

          Após o merge: https://tfalc.github.io/botafogo-news/
          EOF
          )"

          BODY="$(printf '%s\n' "$BODY" | sed 's/^          //')"
          BODY="${BODY//__BRANCH__/$BRANCH}"
          BODY="${BODY//__SHA__/${GITHUB_SHA:0:7}}"
          BODY="${BODY//__TITLE__/$TITLE}"

          set +e
          OUT="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body "$BODY" 2>&1)"
          CODE=$?
          set -e

          if [[ $CODE -eq 0 ]]; then
            echo "$OUT"
            echo "PR criado: $BRANCH → main"
            exit 0
          fi

          if echo "$OUT" | grep -qi 'already exists\|already open\|A pull request already exists'; then
            echo "PR já existia para $BRANCH"
            exit 0
          fi

          if echo "$OUT" | grep -qi 'not permitted to create or approve pull requests'; then
            echo "::error::GITHUB_TOKEN sem permissão para criar PR."
            echo "Ative em: Settings → Actions → General → Workflow permissions →"
            echo "\"Allow GitHub Actions to create and approve pull requests\""
            echo "Detalhe: $OUT"
            exit 1
          fi

          echo "::error::Falha ao criar PR: $OUT"
          exit "$CODE"
